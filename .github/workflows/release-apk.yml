name: Release APK

on:
  push:
    branches:
      - "feature/simplified-chinese-language"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Prepare release asset
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${INPUT_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="v1.0.1"
          fi

          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "${apk_path}" ]]; then
            echo "No release APK was generated." >&2
            exit 1
          fi

          cp "${apk_path}" kihon.apk
          sha256sum kihon.apk > kihon.apk.sha256
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: kihon-release-apk
          path: |
            kihon.apk
            kihon.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" kihon.apk kihon.apk.sha256 \
            --target "${GITHUB_SHA}" \
            --title "Kihon ${RELEASE_TAG}" \
            --generate-notes
